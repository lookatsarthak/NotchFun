name: Report a bug
description: Something in NotchFun isn't working right.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One problem per report, please — it makes each one easier to fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did and what you saw. A screenshot or a short screen recording helps a lot.
      placeholder: "I dragged a file to the notch and…"
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NotchFun version
      description: In Settings → About. Filled in for you when you report from the app.
      placeholder: "1.5.2"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS version
      description:  menu → About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: music-source
    attributes:
      label: Music source (if it's about music)
      description: Settings → Media.
      options:
        - Now Playing
        - Apple Music
        - Spotify
    validations:
      required: false
  - type: input
    id: music-app
    attributes:
      label: App or website playing the music (if relevant)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log output (optional)
      description: If you have any. It's formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
