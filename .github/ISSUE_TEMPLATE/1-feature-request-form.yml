name: Suggest a feature
description: An idea for something NotchFun should do.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Have a look at [existing suggestions](https://github.com/lookatsarthak/NotchFun/issues?q=is%3Aissue+label%3Aenhancement) first — a 👍 on one you like helps it get picked.
  - type: textarea
    id: problem
    attributes:
      label: What would you like the notch to do?
      placeholder: "It would be great if the notch…"
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: When would you use it?
      description: A real moment from your day is the most useful thing you can add.
      placeholder: "Every morning when I…"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Mockups, screenshots, or an app that does it well. You can drag images in.
    validations:
      required: false
