<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NotchFun numbers</title>
<style>
  :root { --bg: #0b0a1c; --card: #16142e; --line: rgba(255,255,255,.08); --ink: #f3f1ff; --ink2: #a9a4c9; --lav: #b9a4ff; --pink: #ff7ab8; --green: #5ee0a0; --red: #ff7a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--lav); margin: 34px 0 12px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  button { cursor: pointer; background: var(--lav); color: #120f2a; font-weight: 600; border: 0; }
  button.ghost { background: var(--card); color: var(--ink2); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
  .signin { max-width: 420px; margin: 12vh auto 0; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
  .signin h2 { margin: 0 0 8px; font-size: 20px; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .signin p { color: var(--ink2); margin: 0 0 18px; }
  .signin button { padding: 12px 22px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .stat b { display: block; font-size: 30px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink2); font-size: 13px; }
  .stat svg { display: block; width: 100%; height: 28px; margin-top: 8px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
  .wide { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--ink2); font-weight: 500; font-size: 13px; }
  td.n { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .fb { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .fb p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { color: var(--ink2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .tag { color: #120f2a; background: var(--lav); border-radius: 999px; padding: 0 8px; font-weight: 600; }
  .tag.bug { background: var(--pink); }
  .empty { color: var(--ink2); }
  .bars { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 84px; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
  .bar .track { display: block; height: 10px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar .fill { display: block; min-width: 2px; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--lav), var(--pink)); }
  .bar .v { text-align: right; color: var(--ink2); font-size: 13px; }
  .note { color: var(--ink2); font-size: 13px; margin: -4px 0 10px; }
  .err { color: var(--red); }
</style>
</head>
<body>
<main>
  <header>
    <h1>NotchFun numbers</h1>
    <div class="controls" id="controls" hidden>
      <select id="days" aria-label="Period">
        <option value="1">Today</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option>
      </select>
      <select id="os" aria-label="Platform">
        <option value="">All platforms</option><option value="mac">Mac</option><option value="ios">iPhone &amp; iPad</option><option value="android">Android</option><option value="windows">Windows</option><option value="linux">Linux</option><option value="other">Other</option>
      </select>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </div>
  </header>
  <div id="out"><p class="empty">Loading…</p></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Signed in with a cookie from the emailed link; nothing to type. (The admin token still
// works as a header, for scripts.)
$('#days').addEventListener('change', load);
$('#os').addEventListener('change', load);
$('#signout').addEventListener('click', async () => { await fetch('/admin/logout', { method: 'POST' }); location.reload(); });
load();

async function load() {
  const res = await fetch(`/stats?days=${$('#days').value}&os=${$('#os').value}`, { credentials: 'same-origin' });
  if (res.status === 401) return signIn();
  if (!res.ok) { $('#out').innerHTML = `<p class="err">Could not load (${res.status}). Try again in a moment.</p>`; return; }
  $('#controls').hidden = false;
  render(await res.json());
}

function signIn() {
  $('#controls').hidden = true;
  $('#out').innerHTML = `
    <div class="signin">
      <h2>Sign in</h2>
      <p>We'll email a sign-in link to the NotchFun feedback inbox. This browser then stays signed in for 90 days.</p>
      <button id="send" type="button">Email me a sign-in link</button>
      <p class="err" id="msg" hidden></p>
    </div>`;
  $('#send').addEventListener('click', async () => {
    const b = $('#send');
    b.disabled = true; b.textContent = 'Sending…';
    const res = await fetch('/admin/link', { method: 'POST' }).catch(() => null);
    if (res?.ok) {
      b.hidden = true;
      $('.signin p').textContent = "Sent. Open the email on this device and click the link. It works once, for 15 minutes.";
    } else {
      b.disabled = false; b.textContent = 'Email me a sign-in link';
      const msg = $('#msg'); msg.hidden = false;
      msg.textContent = res?.status === 429 ? 'Three links were sent in the last hour. Use one of those, or try again later.' : "Couldn't send the email. Try again in a moment.";
    }
  });
}

const SECTIONS = [['hero', 'Top of the page'], ['shelf', '01 Shelf'], ['music', '02 Now playing'], ['clip', '03 Clipboard'], ['cal', '04 Calendar'],
  ['keys', '05 Volume & brightness'], ['little', '06 Little things'], ['install', 'Install'], ['native', 'Made for the Mac'],
  ['changelog', 'Changelog'], ['community', 'Community'], ['faq', 'Questions'], ['footer', 'Bottom of the page']];
const DEMOS = { 'music:play': 'Music: play/pause', 'music:next': 'Music: next', 'music:prev': 'Music: previous', 'shelf:drag': 'Shelf: dragged a file',
  'clip:copy': 'Clipboard: copied', 'clip:search': 'Clipboard: searched', 'keys:press': 'Volume keys: pressed',
  'little:caffeine': 'Little things: Caffeine', 'little:charging': 'Little things: Charging', 'little:airpods': 'Little things: AirPods',
  'little:mirror': 'Little things: Mirror', 'native:width': 'Width slider' };
const FAQS = { free: 'Is it really free?', warning: 'Why does macOS warn me?', macs: 'Which Macs?', permissions: 'What permissions?', privacy: 'Does anything leave my Mac?' };
const TIMES = ['<10s', '10-30s', '30s-2m', '2-5m', '5m+'];
const PLATFORMS = { 'mac/desktop': 'Mac', 'ios/phone': 'iPhone', 'ios/tablet': 'iPad', 'android/phone': 'Android phone', 'android/tablet': 'Android tablet',
  'windows/desktop': 'Windows', 'windows/tablet': 'Windows tablet', 'linux/desktop': 'Linux', 'linux/tablet': 'Linux tablet', '': 'Unknown' };
const platformName = p => PLATFORMS[p] ?? (p.startsWith('other/') ? 'Other' : p);
const OS_NAMES = { mac: 'Mac', ios: 'iPhone & iPad', android: 'Android', windows: 'Windows', linux: 'Linux', other: 'Other' };

function render(d) {
  const sum = (event, channel) => d.totals.filter(t => t.event === event && (channel === undefined || t.channel === channel)).reduce((a, t) => a + t.n, 0);
  const series = event => {
    const byDay = new Map(d.daily.filter(r => r.event === event).map(r => [r.day, r.n]));
    return Array.from({ length: d.days }, (_, i) => byDay.get(new Date(Date.now() - (d.days - 1 - i) * 864e5).toISOString().slice(0, 10)) || 0);
  };
  const spark = values => {
    const max = Math.max(1, ...values), w = 100 / Math.max(1, values.length - 1);
    const pts = values.map((v, i) => `${(i * w).toFixed(2)},${(28 - (v / max) * 26).toFixed(2)}`).join(' ');
    return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" style="color:var(--lav)"/></svg>`;
  };
  const gh = Object.fromEntries(d.github.map(r => [r.metric, r.value]));
  const stat = (label, value, event) => `<div class="stat"><b>${value.toLocaleString()}</b><span>${label}</span>${event ? spark(series(event)) : ''}</div>`;
  const table = (head, rows) => rows.length
    ? `<table><tr>${head.map((h, i) => `<th${i === head.length - 1 ? ' class="n"' : ''}>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td${i === r.length - 1 ? ' class="n"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`
    : `<table><tr>${head.map((h, i) => `<th${i === head.length - 1 ? ' class="n"' : ''}>${h}</th>`).join('')}</tr><tr><td class="empty" colspan="${head.length}">Nothing yet</td></tr></table>`;
  const channels = event => d.totals.filter(t => t.event === event).map(t => [t.channel || '—', t.n]);
  const pct = (n, base) => (base && n ? ` <span class="v">· ${Math.round((n / base) * 100)}%</span>` : '');
  const platformTable = list => list.length
    ? `<div class="wide"><table><tr><th>Platform</th><th class="n">Visits</th><th class="n">Saw features</th><th class="n">Reached Install</th><th class="n">Copied or downloaded</th><th class="n">Installed</th><th class="n">Feedback</th><th class="n">Stars</th></tr>${
        list.map(r => `<tr><td>${esc(platformName(r.platform))}</td><td class="n">${r.visits}</td><td class="n">${r.features}${pct(r.features, r.landed)}</td><td class="n">${r.install}${pct(r.install, r.landed)}</td><td class="n">${r.action}${pct(r.action, r.landed)}</td><td class="n">${r.installs}</td><td class="n">${r.feedback}</td><td class="n">${r.stars}</td></tr>`).join('')}</table></div>`
    : '<table><tr><th>Platform</th></tr><tr><td class="empty">Nothing yet</td></tr></table>';
  const bars = (rows, base) => rows.length && base
    ? `<div class="bars">${rows.map(([label, n]) => {
        const pct = Math.round((n / base) * 100);
        return `<div class="bar"><span>${esc(label)}</span><span class="track"><span class="fill" style="width:${Math.min(100, pct)}%"></span></span><span class="v">${n.toLocaleString()} · ${pct}%</span></div>`;
      }).join('')}</div>`
    : '<p class="empty">Nothing yet.</p>';

  $('#out').innerHTML = `
    <h2>By platform</h2>
    <p class="note">All platforms, last ${d.days} days. Only Macs can install, so the Mac row is the one to grow.</p>
    ${platformTable(d.byPlatform)}

    <h2>Last ${d.days} days${d.os ? ` · ${OS_NAMES[d.os]} only` : ''}</h2>
    <div class="grid">
      ${stat('Website visits', sum('view'), 'view')}
      ${stat('Unique visitors', sum('visitor'), 'visitor')}
      ${stat('Disk image downloads', sum('dmg'), 'dmg')}
      ${stat('Terminal installs', sum('curl_ok'), 'curl_ok')}
      ${stat('Terminal install failures', sum('curl_fail'), 'curl_fail')}
      ${stat('Homebrew installs', sum('brew'), 'brew')}
      ${stat('Star button clicks', sum('star_click'), 'star_click')}
      ${stat('Feedback received', d.feedback.filter(f => f.created_at.slice(0, 10) >= d.since).length)}
    </div>

    <h2>Funnel</h2>
    <p class="note">Visitors per day, linked only within the same day. Installs from Terminal and Homebrew are counted separately above.</p>
    ${bars([['Landed', d.funnel.landed], ['Saw the features', d.funnel.features], ['Reached Install', d.funnel.install], ['Copied or downloaded', d.funnel.action]], d.funnel.landed)}

    <h2>How far people get</h2>
    <p class="note">Share of visits that reached each part of the page, top to bottom.</p>
    ${bars(SECTIONS.map(([key, label]) => [label, sum('section', key)]), sum('view'))}

    <h2>What they try</h2>
    <div class="cols">
      <div>${table(['Demo', 'Visits'], channels('demo').map(([c, n]) => [DEMOS[c] || c, n]))}</div>
      <div>${table(['Chapter: Try it / Watch the real app', 'Visits'], channels('toggle').map(([c, n]) => [c.replace(':try', ' · Try it').replace(':real', ' · Real app'), n]))}</div>
      <div>${table(['Watched a video to the end', 'Visits'], channels('video_end'))}</div>
      <div>${table(['FAQ opened', 'Visits'], channels('faq_open').map(([c, n]) => [FAQS[c] || c, n]))}</div>
      <div>${table(['Went to', 'Visits'], channels('outbound'))}</div>
      <div>${table(['Getting it installed', 'Visits'], [['Hero: Install with one line (Mac)', sum('copy_curl', 'hero')], ['Install section: copied the line', sum('copy_curl', 'install')],
        ['After downloading: switched to one line', sum('dl_help', 'oneline')], ['After downloading: asked why macOS warns', sum('dl_help', 'faq')], ['Hero: See how it works (not Mac)', sum('see_how', 'hero')]])}</div>
      <div>${table(['Other', 'Visits'], [['Opened the whole changelog', sum('changelog_more')], ['Opened feedback', sum('feedback_open')]])}</div>
      <div>${table(['Send to my Mac (not on a Mac)', 'Visits'], [['Tapped Send to my Mac', sum('send_mac', 'open')], ['Shared it (AirDrop, Messages…)', sum('send_mac', 'share')],
        ['Emailed it to themselves', sum('send_mac', 'email')], ['Copied the link', sum('send_mac', 'copy')], ['Came back on a Mac from a sent link', d.sentBackOnMac]])}</div>
    </div>

    <h2>Who visits</h2>
    <div class="cols">
      <div>${table(['Device', 'Visits'], channels('device'))}</div>
      <div>${table(['Language', 'Visits'], channels('lang'))}</div>
      <div>${table(['Time on page', 'Visits'], TIMES.map(t => [t, sum('time', t)]))}</div>
    </div>

    <h2>GitHub, latest copy</h2>
    <div class="grid">
      ${stat('Stars', gh.stars ?? 0)}
      ${stat('Forks', gh.forks ?? 0)}
      ${stat('GitHub downloads of NotchFun.dmg (website + Terminal)', gh.gh_downloads_notchfun_dmg ?? 0)}
      ${stat('GitHub downloads of versioned files (Homebrew + app updates)', gh.gh_downloads_versioned ?? 0)}
    </div>

    <h2>Where it came from</h2>
    <div class="cols">
      <div>${table(['Download button', 'Clicks'], channels('dmg'))}</div>
      <div>${table(['Referring site', 'Visits'], channels('view'))}</div>
      <div>${table(['Terminal install failed at', 'Count'], channels('curl_fail'))}</div>
      <div>${table(['Terminal installs by Mac', 'Count'], channels('curl_ok'))}</div>
      <div>${table(['Star click from', 'Clicks'], channels('star_click'))}</div>
      <div>${table(['Copied', 'Clicks'], [['Terminal command', sum('copy_curl')], ['Homebrew command', sum('copy_brew')], ['Install section seen', sum('install_seen')]])}</div>
      <div>${table(['Country (downloads + installs)', 'Count'], d.countries.map(c => [c.country || 'Unknown', c.n]))}</div>
      <div>${table(['Version', 'Count'], d.versions.map(v => [`${v.version} · ${{ brew: 'Homebrew', curl_ok: 'Terminal', curl_start: 'Terminal started', curl_fail: 'Terminal failed' }[v.event] || v.event}`, v.n]))}</div>
      <div>${table(['GitHub referrer (14 days)', 'Views'], d.github.filter(r => r.metric.startsWith('gh_ref14:')).map(r => [r.metric.slice(9), r.value]))}</div>
    </div>

    <h2>Feedback</h2>
    ${d.feedback.length ? d.feedback.map(f => `
      <div class="fb">
        <div class="meta"><span class="tag ${f.kind === 'bug' ? 'bug' : ''}">${esc(f.kind)}</span><span>${esc(new Date(f.created_at).toLocaleString())}</span><span>${f.email ? `<a href="mailto:${esc(f.email)}" style="color:var(--lav)">${esc(f.email)}</a>` : 'no email'}</span><span>${esc(f.source)}${f.app_version ? ' · ' + esc(f.app_version) : ''}${f.macos ? ' · macOS ' + esc(f.macos) : ''}</span>${f.emailed ? '' : '<span class="err">not emailed</span>'}</div>
        <p>${esc(f.message)}</p>
      </div>`).join('') : '<p class="empty">No feedback yet.</p>'}
  `;
}
</script>
</body>
</html>
